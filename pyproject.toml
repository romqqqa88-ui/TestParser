[project]
name = "avito-parser-console"
version = "0.1.0"
description = "Async console parser for Avito real estate with PostgreSQL and Excel export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.3",
    "curl-cffi>=0.7.1",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.1",
    "questionary>=2.0.1",
    "rich>=13.7.1",
    "sqlalchemy>=2.0.31",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.13.2",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.8",
]

playwright = [
    "playwright>=1.40.0",
]

[project.scripts]
avito-parser = "avito_parser_console.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
