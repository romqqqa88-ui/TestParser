name: CI Smoke

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avito_parser
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d avito_parser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/avito_parser
      ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avito_parser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install psycopg2-binary

      - name: Run tests
        run: pytest -q

      - name: Run smoke script
        run: bash scripts/smoke.sh
